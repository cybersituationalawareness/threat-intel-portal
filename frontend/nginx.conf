server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # ── SPA Fallback ─────────────────────────────────────────────────────────
    # Prevents 404 errors when a user refreshes on a client-side route.
    # All non-asset requests are served index.html so React Router handles routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── API Reverse Proxy ─────────────────────────────────────────────────────
    # Forwards all /api/* requests to the FastAPI backend container.
    # The full path (including /api/) is preserved when proxy_pass has no trailing path.
    location ^~ /api/ {
        client_max_body_size 50M;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static Asset Caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
